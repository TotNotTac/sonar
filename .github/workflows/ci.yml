name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install WebKitGTK and friends (cached)
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
          version: 1.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Round-trip a file through the real Trash
        if: runner.os == 'Linux'
        run: cargo test -p sonar-core -- --ignored

  arch:
    name: Core on Arch Linux
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Install Rust
        run: |
          # pacman's download sandbox can't always set up seccomp inside containers.
          sed -i 's/^\[options\]/[options]\nDisableSandbox/' /etc/pacman.conf
          # shared-mime-info + an icon theme let the type/icon tests use real system data.
          pacman -Syu --noconfirm --needed rust gcc git shared-mime-info adwaita-icon-theme util-linux
      - uses: actions/checkout@v4
      - run: cargo test -p sonar-core
      - run: cargo test -p sonar-core -- --ignored

  ui:
    name: UI (Chromium + WebKit)
    runs-on: ubuntu-24.04
    # Browsers and their system libraries come preinstalled; installing them
    # on a bare runner took ~8 of this job's ~10 minutes.
    # Keep the tag in sync with @playwright/test in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
