name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install WebKitGTK and friends
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Round-trip a file through the real Trash
        if: runner.os == 'Linux'
        run: cargo test -p sonar-core -- --ignored

  arch:
    name: Core on Arch Linux
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Install Rust
        run: |
          # pacman's download sandbox can't always set up seccomp inside containers.
          sed -i 's/^\[options\]/[options]\nDisableSandbox/' /etc/pacman.conf
          pacman -Syu --noconfirm --needed rust gcc git
      - uses: actions/checkout@v4
      - run: cargo test -p sonar-core
      - run: cargo test -p sonar-core -- --ignored

  ui:
    name: UI (Chromium + WebKit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
