[package]
name = "sonar-core"
description = "Platform-aware filesystem model for the Sonar file manager"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
thiserror.workspace = true
dirs.workspace = true
notify-debouncer-mini = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSError", "NSFileManager", "NSString", "NSURL"] }

[target.'cfg(target_os = "linux")'.dependencies]
trash = "5"

[dev-dependencies]
tempfile = "3"
