[workspace]
resolver = "2"
members = ["crates/sonar-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
sonar-core = { path = "crates/sonar-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
dirs = "6"

[profile.release]
lto = true
codegen-units = 1
strip = true
